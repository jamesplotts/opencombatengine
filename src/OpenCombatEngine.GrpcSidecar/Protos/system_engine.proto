//
// System Engine contract (docs/design.md §6.1). Master calls this service
// for all rules resolution; it never inlines system-specific logic itself.
// OpenCombatEngine (D&D, docs/design.md §12) is the reference
// implementation, running as an out-of-process gRPC sidecar. Any future
// system engine (Vampire, Pathfinder, etc.) implements this same service
// in any language with a protobuf compiler — that's the whole point of
// this being the extensibility seam rather than an in-language interface.
//
// Generate stubs with protocol/generate.sh; do not hand-edit generated
// code. The Go stubs land inside the Master module itself
// (master/internal/systemenginepb/, gitignored — regenerate, don't
// commit) rather than under a repo-level protocol/gen/, since Go modules
// can't cleanly import generated code living outside their own tree
// without workspace/multi-module machinery this project doesn't need
// yet — see protocol/README.md. A future non-Go consumer's stubs (e.g. a
// Python reference SDK) would generate into that consumer's own
// language-appropriate location instead.

syntax = "proto3";

package layforge.systemengine.v1;

option go_package = "github.com/jamesplotts/layforge/master/internal/systemenginepb;systemenginepb";
option csharp_namespace = "Layforge.Protocol.SystemEngine.V1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// SystemEngine is the contract Master calls against for all mechanical
// rules resolution. Governance gates (docs/design.md §9) are enforced by
// Master before calling ApplyEffect-shaped methods, not inside the engine
// — the engine answers "what would happen", Master decides "is this
// allowed to happen".
service SystemEngine {
  // ResolveCheck resolves a mechanical check (attack roll, saving throw,
  // skill check, etc.) and returns an authoritative outcome. Master
  // treats this result as final — it narrates around it, it does not
  // recompute or override it.
  rpc ResolveCheck(ResolveCheckRequest) returns (ResolveCheckResponse);

  // ApplyEffect applies a mechanical effect (damage, healing, condition,
  // buff/debuff) to an actor and returns the resulting relevant state.
  rpc ApplyEffect(ApplyEffectRequest) returns (ApplyEffectResponse);

  // GetCharacterSchema returns the JSON Schema (draft 2020-12) describing
  // this engine's character-sheet shape, so a client can render a
  // schema-driven stat/inventory/spells/actions panel without any system
  // hardcoded into the UI (docs/design.md §4).
  rpc GetCharacterSchema(GetCharacterSchemaRequest) returns (GetCharacterSchemaResponse);

  // GetCharacterStatus reports a character's current mechanical status,
  // driving Master's turn-order state machine (docs/design.md §3.1, §9.3).
  // The AI is not trusted to track this reliably over a long session —
  // this call is the deterministic source of truth.
  rpc GetCharacterStatus(GetCharacterStatusRequest) returns (GetCharacterStatusResponse);

  // StartTurn runs the engine's own start-of-turn bookkeeping for actor
  // — today, an automatic death saving throw (docs/design.md §9.3) if
  // actor is at 0 HP, not dead, and not stable, plus the engine's other
  // per-turn resets (action economy, condition/effect duration ticks).
  // Master calls this exactly once, when its turn-order state machine
  // (docs/design.md §3.1) advances to a character's turn — the SRD rule
  // that a dying character re-rolls a death save every turn is
  // mechanical, not something the DM decides or has to remember.
  // Stateless across the RPC boundary like ApplyEffect: the full actor
  // (with any mutation already applied) comes back for Master to
  // persist.
  rpc StartTurn(StartTurnRequest) returns (StartTurnResponse);

  // ValidateCharacter runs mechanical validation over character data
  // (typically an uploaded/imported sheet) and returns warnings, feeding
  // Master's character-import review panel (docs/design.md §9.4). This
  // call does not judge legality/licensing of content — that is out of
  // scope for the engine (docs/design.md §12, "we provide the pipes").
  rpc ValidateCharacter(ValidateCharacterRequest) returns (ValidateCharacterResponse);

  // ToJson serializes a character to this engine's canonical JSON
  // representation, versioned via schema_version.
  rpc ToJson(ToJsonRequest) returns (ToJsonResponse);

  // FromJson deserializes a character from this engine's canonical JSON
  // representation. Returns validation warnings inline rather than
  // requiring a separate ValidateCharacter round trip for the common
  // import path.
  rpc FromJson(FromJsonRequest) returns (FromJsonResponse);

  // CastSpell attempts to cast actor's named spell — the real mechanical
  // gate against casting a spell that isn't prepared/known or that has
  // no available slot (docs/design.md §8, §9: "gates over prompting"),
  // not something Master or the DM's own narrative judgment enforces.
  // The engine checks preparation, checks and consumes a slot, and
  // applies the spell's real effect (attack/save roll, damage, healing,
  // conditions) in one call. Stateless across the RPC boundary like
  // ApplyEffect: the full updated actor(s) come back for Master to
  // persist. Single-target (or no target, for a self-only spell) only —
  // this contract does not yet carry positional/grid data for an
  // area-of-effect spell to resolve against multiple targets in one
  // call.
  rpc CastSpell(CastSpellRequest) returns (CastSpellResponse);

  // StreamEvents re-exposes the engine's internal event feed (e.g.
  // OpenCombatEngine's TurnStarted/DamageDealt/CombatEnded C# events,
  // docs/design.md §12) as a server-streaming feed. Master cannot
  // subscribe to in-process language events across the sidecar process
  // boundary, so the engine relays each event across this stream instead
  // of Master polling for state changes.
  rpc StreamEvents(StreamEventsRequest) returns (stream EngineEvent);

  // Attack resolves a weapon attack (melee or ranged) with attacker's
  // currently-equipped main-hand weapon — the real mechanical gate
  // against a martial character's attack that a bare-handed narration
  // or apply_effect call would otherwise leave to the DM model's own
  // judgment (docs/design.md §8, §9: "gates over prompting"), the same
  // reasoning CastSpell already applies to spellcasting. The engine
  // rejects the call outright (success = false) when no weapon is
  // equipped, or when the equipped weapon's own real properties don't
  // support the requested kind — a bow (Ammunition, no Melee-usable
  // property) can't be used for ATTACK_KIND_MELEE, and a pure melee
  // weapon with none of Range/Thrown/Ammunition can't be used for
  // ATTACK_KIND_RANGED. Otherwise runs the already-tested AttackAction
  // (attack roll, advantage/disadvantage from conditions and flanking,
  // range/line-of-sight via grid_context, crits, damage) exactly as
  // CastSpell runs CastSpellAction. Stateless across the RPC boundary
  // like every other mutating call in this contract: the full updated
  // attacker/target come back for Master to persist.
  rpc Attack(AttackRequest) returns (AttackResponse);

  // GetAvailableActions computes the full concrete list of mechanically
  // legal actions actor could take right now, against each of
  // candidate_targets — every equipped-weapon attack option (including
  // an off-hand/secondary weapon, per SRD Two-Weapon Fighting), every
  // Grapple/Shove option, and every currently-castable prepared/known
  // spell — rather than leaving Master or the DM model to guess (docs/
  // design.md §8, §9: "gates over prompting"). The engine — not
  // Master, which owns no rules logic, and not the DM's own narrative
  // judgment — is the only thing that actually has the real equipment/
  // spellcasting/condition/action-economy state needed to answer this.
  // Every fact returned is already independently enforced by Attack/
  // CastSpell/a future Grapple-Shove RPC when actually called — this
  // is a menu, not a new source of authority. Stateless like every
  // other RPC here: the engine holds no combat-participant list of its
  // own, so Master supplies candidate_targets explicitly.
  rpc GetAvailableActions(GetAvailableActionsRequest) returns (GetAvailableActionsResponse);

  // Grapple resolves a real SRD grapple attempt — an opposed check
  // (actor's Strength (Athletics) against target's better of
  // Athletics/Acrobatics) that, on success, applies the Grappled
  // condition. Requires a free hand (actor's own equipped weapons
  // permitting), the same real precondition GrappleAction itself
  // enforces — a rejection here means the attempt was never rolled at
  // all (no free hand, out of reach, incapacitated), not a miss.
  rpc Grapple(GrappleRequest) returns (GrappleResponse);

  // Shove resolves a real SRD shove attempt — the same opposed check as
  // Grapple, no free-hand requirement, that on success either knocks
  // target prone or pushes it 5 feet away from actor, per
  // ShoveRequest.effect.
  rpc Shove(ShoveRequest) returns (ShoveResponse);

  // EquipItem moves an item already in actor's inventory into an
  // equipment slot — the real mechanical gate against equipping
  // something not actually carried (docs/design.md §8, §9: "gates
  // over prompting"), and the first way anything can change a
  // character's equipment after character.upload's own one-time
  // initial setup. Rejects outright when item_name isn't a real
  // member of actor's inventory.
  rpc EquipItem(EquipItemRequest) returns (EquipItemResponse);

  // UnequipItem clears one equipment slot. The item stays in actor's
  // inventory — this only changes what's readied, not what's carried.
  rpc UnequipItem(UnequipItemRequest) returns (UnequipItemResponse);

  // AddItemToInventory resolves item_name against the sidecar's real
  // Open5e-backed item library and adds it to actor's inventory — the
  // real mechanical gate against inventing an item that doesn't exist
  // in SRD content (docs/design.md §8, §9). An unrecognized name is a
  // real rejection, not a guess.
  rpc AddItemToInventory(AddItemToInventoryRequest) returns (AddItemToInventoryResponse);

  // RemoveItemFromInventory removes a real member of actor's inventory
  // permanently (discarded — not placed anywhere retrievable; this
  // contract has no "item on the ground" concept). Auto-unequips first
  // if the item was equipped (StandardInventory's own existing
  // behavior — see that class's RemoveItem doc comment).
  rpc RemoveItemFromInventory(RemoveItemFromInventoryRequest) returns (RemoveItemFromInventoryResponse);

  // TransferItem moves a real member of source's inventory into
  // target's inventory in one call — auto-unequips (and, if attuned,
  // unattunes) on the source side first. Stateless like every other
  // mutating call in this contract: both updated actors come back for
  // Master to persist.
  rpc TransferItem(TransferItemRequest) returns (TransferItemResponse);

  // GenerateLoot computes CR-appropriate treasure for a roster of
  // creatures (typically called at encounter-prep time, right after
  // creating them, so the DM can place real items onto real NPCs they
  // can actually use in the fight — not as a post-combat reward roll).
  // Combining multiple participants' challenge ratings into one
  // effective CR is real system-engine math (docs/design.md §6.1) —
  // Master never computes or holds a raw CR itself. A participant with
  // no real challenge_rating recorded, or an empty participant list, is
  // a real rejection.
  rpc GenerateLoot(GenerateLootRequest) returns (GenerateLootResponse);

  // AddCurrency adds currency to actor's inventory from nothing (a
  // treasure placement, a narrative reward) — the currency equivalent
  // of AddItemToInventory.
  rpc AddCurrency(AddCurrencyRequest) returns (AddCurrencyResponse);

  // TransferCurrency moves currency from source's inventory into
  // target's — the currency equivalent of TransferItem. Rejects if
  // source doesn't have enough of any requested denomination (this does
  // not make change across denominations).
  rpc TransferCurrency(TransferCurrencyRequest) returns (TransferCurrencyResponse);

  // RemoveCurrency removes currency from actor's inventory into
  // nothing — the currency equivalent of RemoveItemFromInventory, and
  // AddCurrency's inverse. Rejects if actor doesn't have enough of any
  // requested denomination, the same real precondition
  // TransferCurrency's own remove-half already enforces. Exists for a
  // caller that needs to debit an actor without a second real Actor on
  // the receiving end (e.g. a location-scoped stash that isn't a
  // character) — TransferCurrency can't express that.
  rpc RemoveCurrency(RemoveCurrencyRequest) returns (RemoveCurrencyResponse);

  // GetItemInfo looks up item_name's real base price from the sidecar's
  // Open5e-backed item library (the same library AddItemToInventory
  // resolves names against) without adding it to anyone's inventory —
  // the vendor-economy tool layer's real price source (docs/design.md
  // §8, §9: never let the DM model invent a price). An unrecognized name
  // is a real rejection, not a guess, same as AddItemToInventory.
  rpc GetItemInfo(GetItemInfoRequest) returns (GetItemInfoResponse);

  // ListInventory returns the real item names currently held by actor —
  // needed because Actor.character_data is opaque to Master (see that
  // field's own doc comment): Master cannot enumerate a character's
  // inventory by inspecting character_data itself, so a vendor-stock
  // listing needs this real RPC rather than a Master-side guess at the
  // engine's own inventory shape.
  rpc ListInventory(ListInventoryRequest) returns (ListInventoryResponse);

  // StartCharacterCreation begins a new interactive character-creation
  // session (docs/design.md §9.4's "roll a new character" path) and
  // returns the first prompt. The engine owns the entire question
  // sequence — what to ask next given what's answered so far, when a
  // spellcasting class needs an extra step, when the character is
  // done — Master's role is only to relay each CharacterCreationPromptResponse
  // to the requesting player and forward their answer back via
  // AnswerCharacterCreationPrompt, never to decide step order itself
  // (that would be D&D/SRD-specific logic leaking into Master, the
  // same "adapter is thin, the engine owns domain logic" principle
  // every other call in this contract already follows). Session state
  // is held in-memory by the engine, keyed by session_id — ephemeral
  // by design; a sidecar restart or an abandoned session loses that
  // player's in-progress answers, the same "lost until a persistence
  // layer is added" posture Master itself accepts for other in-memory
  // state.
  rpc StartCharacterCreation(StartCharacterCreationRequest) returns (CharacterCreationPromptResponse);

  // AnswerCharacterCreationPrompt records an answer against whatever
  // question session_id currently has pending, and returns either the
  // next prompt or (once every required question has been answered
  // for the session's mode) the finished character. Calling this with
  // an unknown/expired session_id is a real rejection (success =
  // false), not a crash.
  rpc AnswerCharacterCreationPrompt(AnswerCharacterCreationPromptRequest) returns (CharacterCreationPromptResponse);

  // ListClassSpells returns class_name's real cantrip and first-level
  // spell options, straight from the same spell repository the
  // character-creation spell-pick prompts and cast_spell's own
  // class-list validation already use — so Master can show a detailed-
  // roll player their real choices before they answer, without a
  // second, possibly-drifting spell list of its own.
  rpc ListClassSpells(ListClassSpellsRequest) returns (ListClassSpellsResponse);
}

// Actor identifies a character/creature and carries its current data as
// this engine's schema defines it (see GetCharacterSchema). character_data
// is opaque to Master — Master stores and forwards it, but only the
// engine that owns schema_version interprets its fields.
message Actor {
  string actor_id = 1;
  google.protobuf.Struct character_data = 2;
  string schema_version = 3;
}

message ResolveCheckRequest {
  string request_id = 1;
  string campaign_id = 2;
  Actor actor = 3;
  // System-specific check parameters: check type, target DC, advantage/
  // disadvantage, opposed-roll target, roll-spec overrides, etc. Shape is
  // engine-defined, not assumed d20-based (docs/design.md §4).
  google.protobuf.Struct params = 4;
}

message ResolveCheckResponse {
  bool success = 1;
  Outcome outcome = 2;
  // Set when success = false; a resolution failure (e.g. malformed
  // params), distinct from a mechanical failure result inside Outcome.
  string error = 3;
}

message DieRoll {
  int32 sides = 1;
  int32 result = 2;
  // e.g. "d20", "damage-1", "damage-2" — disambiguates multi-die pools.
  string label = 3;
}

message Outcome {
  repeated DieRoll rolls = 1;
  int32 total = 2;
  bool critical_success = 3;
  bool critical_failure = 4;
  // Short machine-usable label, e.g. "hit", "miss", "success", "failure".
  // Not narrative text — Master's narrative-transform pipeline (docs/
  // design.md §7) is responsible for prose.
  string result_summary = 5;
  // Engine-specific extra data (e.g. margin of success, which ability
  // modifier applied) that Master's tool-use logging (docs/design.md §8)
  // may want to persist verbatim.
  google.protobuf.Struct details = 6;
}

message ApplyEffectRequest {
  string request_id = 1;
  string campaign_id = 2;
  // actor carries the current character_data to apply the effect to —
  // this call is stateless across the RPC boundary like ResolveCheck:
  // the engine holds no creature state of its own between calls (Master
  // owns campaign state, docs/design.md §3.1, §10), so there is nothing
  // for a bare actor_id to look up.
  Actor actor = 3;
  // Damage/heal/condition payload; engine-defined shape.
  google.protobuf.Struct effect = 4;
}

message ApplyEffectResponse {
  bool success = 1;
  // The actor's full character_data after the effect was applied — the
  // new authoritative state for Master to persist. Deliberately the
  // whole actor, not a partial diff: a diff would require Master to know
  // how to merge it back into its own copy, which is exactly the
  // engine-specific knowledge this contract exists to avoid Master
  // needing.
  Actor actor = 2;
  string error = 3;
}

message GetCharacterSchemaRequest {}

message GetCharacterSchemaResponse {
  string schema_version = 1;
  // JSON Schema draft 2020-12, serialized as a JSON string (kept as a
  // string rather than google.protobuf.Struct so the schema document's
  // own JSON Schema keywords, e.g. "$ref", round-trip exactly).
  string json_schema = 2;
}

// CharacterStatus mirrors OpenCombatEngine's status states (docs/
// design.md §9.3). CHARACTER_STATUS_UNSPECIFIED is the required
// proto3 zero value, not a real status — always check for it.
enum CharacterStatus {
  CHARACTER_STATUS_UNSPECIFIED = 0;
  CHARACTER_STATUS_ACTIVE = 1;
  CHARACTER_STATUS_UNCONSCIOUS = 2;
  CHARACTER_STATUS_DYING = 3;
  CHARACTER_STATUS_DEAD = 4;
}

message GetCharacterStatusRequest {
  // actor carries character_data, same reasoning as ApplyEffectRequest:
  // the engine holds no creature state of its own between calls, so
  // there is nothing for a bare actor_id to look up.
  Actor actor = 1;
}

message GetCharacterStatusResponse {
  CharacterStatus status = 1;
}

message StartTurnRequest {
  string request_id = 1;
  string campaign_id = 2;
  // actor carries character_data, same statelessness reasoning as
  // ApplyEffectRequest/GetCharacterStatusRequest.
  Actor actor = 3;
}

message StartTurnResponse {
  bool success = 1;
  // The actor's full character_data after start-of-turn bookkeeping —
  // same reasoning as ApplyEffectResponse.actor: the whole actor, not a
  // partial diff, so Master never needs engine-specific merge logic.
  Actor actor = 2;
  // Set when actor was at 0 HP, not dead, and not stable, so an
  // automatic death saving throw was rolled this call.
  bool death_save_rolled = 3;
  // The real rolled death save, set only when death_save_rolled is true
  // — Master broadcasts this the same way any other roll is broadcast
  // (docs/design.md §3.1, §4), never invents or silently applies it.
  Outcome death_save_outcome = 4;
  // True when the death save (if rolled) was a natural 20 — the
  // character regains 1 HP and wakes up, per SRD rules.
  bool woke_up = 5;
  // Set when success = false; a resolution failure, distinct from a
  // legitimate "no death save this turn" result (death_save_rolled =
  // false with success = true).
  string error = 6;
}

message ValidateCharacterRequest {
  google.protobuf.Struct character_data = 1;
  string schema_version = 2;
}

message ValidationWarning {
  // JSON Pointer or dotted path into character_data, e.g. "/abilities/str".
  string field_path = 1;
  string message = 2;
  // "error" | "warning" — "error" means the character should not be
  // importable as-is; "warning" surfaces to the review panel (docs/
  // design.md §9.4) but doesn't block by itself.
  string severity = 3;
}

message ValidateCharacterResponse {
  repeated ValidationWarning warnings = 1;
}

message ToJsonRequest {
  // actor carries character_data already in the engine's own wire
  // format (e.g. as returned by a prior ResolveCheck/ApplyEffect call);
  // ToJson converts it to the engine's canonical JSON string form —
  // the reverse of FromJson, and symmetric with it for the same
  // statelessness reason: nothing is held between calls to look an
  // actor_id up against.
  Actor actor = 1;
}

message ToJsonResponse {
  string json = 1;
  string schema_version = 2;
}

message FromJsonRequest {
  string json = 1;
}

message FromJsonResponse {
  Actor actor = 1;
  repeated ValidationWarning warnings = 2;
}

message CastSpellRequest {
  string request_id = 1;
  string campaign_id = 2;
  // Stateless across the RPC boundary, same reasoning as every other
  // Actor-carrying request: the engine holds no creature state of its
  // own between calls.
  Actor caster = 3;
  // Exact spell name, matched against caster's spellcasting data
  // (knownSpellNames/preparedSpellNames) — never invented; Master
  // forwards whatever the DM tool call names, and an unrecognized name
  // is a real rejection (error), not a guess.
  string spell_name = 4;
  // The spell's target. Omit entirely for a self-only spell (e.g. Mage
  // Armor) — the engine treats a cast with no target as targeting the
  // caster. Set for any spell that needs an external target; a spell
  // requiring a target that gets none back is a rejection (error), not
  // a guess at who it should hit.
  Actor target = 5;
  // Optional: cast using a higher-level slot than the spell's own
  // minimum (SRD upcasting). 0 (the default) means "use the spell's own
  // base level."
  int32 slot_level = 6;
  // Optional: real positions/blocking-cell data from Master's own combat
  // map (Layforge internal/combatmap — this engine has no notion of a
  // generated map or persisted grid state of its own). Set only when
  // Master has a combat map for this campaign with both caster and
  // target placed on it; omitted entirely otherwise, in which case
  // CastSpellAction's existing range/line-of-sight checks are skipped
  // exactly as they always have been (no behavior change for a request
  // that doesn't set this).
  GridContext grid_context = 7;
}

// GridPosition is a bare grid cell coordinate, 5-foot-square SRD
// convention (matching StandardGridManager.GetDistance's own
// Chebyshev-distance-times-5 formula) — the same coordinate space
// Layforge's own internal/combatmap already uses, so no unit conversion
// happens on either side of this boundary.
message GridPosition {
  int32 x = 1;
  int32 y = 2;
}

// GridContext carries the real positions/blocking-cells a combat map has
// for a spell's caster and target. obstacles lists only line-of-sight-
// blocking cells (Master's combatmap.Cell.BlocksLOS), not a full grid
// dump — see CastSpellRequest.grid_context's own doc comment for when
// this is set at all, and CastSpellAction.Execute's range/line-of-sight
// check (src/OpenCombatEngine.Implementation/Actions/CastSpellAction.cs)
// for how these values are actually used once received.
message GridContext {
  GridPosition caster_position = 1;
  GridPosition target_position = 2;
  repeated GridPosition obstacles = 3;
}

message CastSpellResponse {
  bool success = 1;
  // Set when success = false: unknown spell name, not prepared/known,
  // no slot available at the required level, no action available this
  // turn, etc. — a real mechanical rejection for Master (and the DM
  // model, via the tool result) to act on, never silently ignored.
  string error = 2;
  // The caster's full character_data after casting (slot consumed,
  // concentration set if the spell requires it, action economy spent)
  // — same "whole actor, not a diff" reasoning as every other mutating
  // RPC in this contract.
  Actor caster = 3;
  // The target's full character_data after the spell's effect was
  // applied. Unset when the cast was a self-cast (identical to caster)
  // or when the cast failed.
  Actor target = 4;
  // Human-readable summary of what happened (save result, damage dealt,
  // healing done, condition applied) from the engine's own resolution —
  // there is deliberately no structured per-die Outcome here yet, unlike
  // ResolveCheck; see docs/design.md §11 for why this is scoped as a
  // known follow-up rather than built speculatively now.
  string result_message = 5;
  // True when target's hit points went down as a result of this cast
  // (the sidecar compares target's HP before/after calling the engine's
  // spell-casting logic, deliberately not parsing result_message).
  // Master's PvP gate (design doc §9.1) needs this: unlike apply_effect,
  // whose caller already states effect_type=damage explicitly, Master
  // cannot know whether a *named spell* is damaging without asking the
  // engine — this field lets Master apply the identical
  // damage-against-another-player's-own-character gate apply_effect
  // already has, by choosing whether to persist the returned target's
  // mutated state rather than needing to decide before the call.
  bool target_damaged = 6;
}

message StreamEventsRequest {
  string campaign_id = 1;
}

message EngineEvent {
  // e.g. "TurnStarted", "DamageDealt", "CombatEnded" — engine-defined,
  // not a closed enum here, since new engines will introduce their own.
  string event_type = 1;
  google.protobuf.Struct payload = 2;
  google.protobuf.Timestamp occurred_at = 3;
}

// AttackKind selects which weapon-use rule Attack validates the
// equipped weapon against. ATTACK_KIND_UNSPECIFIED is the required
// proto3 zero value, not a real kind — the engine rejects a request
// carrying it, the same "never let an unset value silently mean
// something valid" reasoning as CharacterStatus.
enum AttackKind {
  ATTACK_KIND_UNSPECIFIED = 0;
  ATTACK_KIND_MELEE = 1;
  ATTACK_KIND_RANGED = 2;
  // A bonus-action attack with the equipped off-hand weapon (SRD
  // Two-Weapon Fighting) — requires both the main-hand and off-hand
  // weapons to have the Light property, and never adds the ability
  // modifier to damage (the core SRD rule, no fighting-style feature
  // exception modeled). Resolves against Equipment.OffHand, not
  // MainHand.
  ATTACK_KIND_OFFHAND = 3;
}

message AttackRequest {
  string request_id = 1;
  string campaign_id = 2;
  // Stateless across the RPC boundary, same reasoning as every other
  // Actor-carrying request. attacker.character_data must already carry
  // an equipped weapon in the hand kind requires (main hand for
  // ATTACK_KIND_MELEE/RANGED, both hands for ATTACK_KIND_OFFHAND) —
  // Attack does not accept an explicit weapon choice; it always
  // resolves against whatever's equipped (docs/design.md §8's
  // "already-equipped, don't re-litigate inventory" reasoning, same as
  // CastSpell not taking a "which spellbook" argument).
  Actor attacker = 3;
  Actor target = 4;
  // Which SRD attack type this is. A weapon that doesn't actually
  // support the requested kind (e.g. ATTACK_KIND_MELEE against a bow,
  // ATTACK_KIND_RANGED against a longsword with no Thrown/Ammunition
  // property, ATTACK_KIND_OFFHAND when either hand's weapon isn't
  // Light) is a real rejection (see AttackResponse.error), not a guess
  // at what the DM meant.
  AttackKind kind = 5;
  // Optional: real positions/blocking-cell data from Master's own
  // combat map, same shape and same "omitted means skip the
  // range/line-of-sight check" reasoning as CastSpellRequest.grid_context.
  GridContext grid_context = 6;
}

message AttackResponse {
  bool success = 1;
  // Set when success = false: no weapon equipped, weapon doesn't
  // support the requested kind, target out of range/no line of sight,
  // no action available this turn, etc. — a real mechanical rejection,
  // never silently ignored.
  string error = 2;
  // The attacker's full character_data after the attack (action
  // economy spent) — same "whole actor, not a diff" reasoning as every
  // other mutating RPC in this contract.
  Actor attacker = 3;
  // The target's full character_data after the attack's effect (if
  // any) was applied. Unset when the attack failed outright.
  Actor target = 4;
  // Human-readable summary of the attack roll and outcome, same
  // reasoning as CastSpellResponse.result_message.
  string result_message = 5;
  // True when the attack roll hit — distinct from success: a clean SRD
  // miss is success = true, hit = false (the attack resolved legally,
  // it just didn't connect), whereas success = false means the attack
  // was never rolled at all (illegal weapon/kind, no weapon, etc.).
  bool hit = 6;
  // True when target's hit points went down as a result of this
  // attack — same PvP-gate purpose as CastSpellResponse.target_damaged:
  // Master decides whether to persist the returned target's mutated
  // state based on this and the campaign's PvP policy, rather than
  // needing to know in advance whether an attack will deal damage.
  bool target_damaged = 7;
}

// ActionEconomyCategory mirrors OpenCombatEngine's ActionType enum
// (Action/BonusAction/Reaction) across the gRPC boundary.
// ACTION_ECONOMY_CATEGORY_UNSPECIFIED is the required proto3 zero
// value, not a real category — same "never let an unset value
// silently mean something valid" reasoning as CharacterStatus.
enum ActionEconomyCategory {
  ACTION_ECONOMY_CATEGORY_UNSPECIFIED = 0;
  ACTION_ECONOMY_CATEGORY_ACTION = 1;
  ACTION_ECONOMY_CATEGORY_BONUS_ACTION = 2;
  ACTION_ECONOMY_CATEGORY_REACTION = 3;
}

// AvailableActionKind is the closed set of concrete action shapes
// GetAvailableActions can report. Movement is deliberately not one of
// these — it's a continuous quantity (feet remaining, already visible
// in character_data), not a discrete pick-one choice the way every
// kind here is.
enum AvailableActionKind {
  AVAILABLE_ACTION_KIND_UNSPECIFIED = 0;
  AVAILABLE_ACTION_KIND_MELEE_ATTACK = 1;
  AVAILABLE_ACTION_KIND_RANGED_ATTACK = 2;
  AVAILABLE_ACTION_KIND_OFFHAND_ATTACK = 3;
  AVAILABLE_ACTION_KIND_CAST_SPELL = 4;
  AVAILABLE_ACTION_KIND_GRAPPLE = 5;
  AVAILABLE_ACTION_KIND_SHOVE_PRONE = 6;
  AVAILABLE_ACTION_KIND_SHOVE_PUSH = 7;
}

message TargetGridPosition {
  string actor_id = 1;
  GridPosition position = 2;
}

// MultiTargetGridContext is GridContext's multi-target sibling —
// GetAvailableActions narrows its menu against several candidate
// targets in one call, which the single-target caster/target shape of
// GridContext (CastSpell/Attack) can't express. Omitted entirely means
// every option is reported without a range/line-of-sight check, the
// same "no grid_context, skip the check" rule every other RPC in this
// contract already follows.
message MultiTargetGridContext {
  GridPosition actor_position = 1;
  repeated TargetGridPosition target_positions = 2;
  repeated GridPosition obstacles = 3;
}

message GetAvailableActionsRequest {
  string request_id = 1;
  string campaign_id = 2;
  // Stateless across the RPC boundary, same reasoning as every other
  // Actor-carrying request.
  Actor actor = 3;
  // Other creatures currently relevant (Master's own turn-order
  // participants) — the engine has no persistent combat-manager
  // session of its own to query this from (every RPC here is
  // stateless per call), so Master supplies it explicitly, the same
  // way it already supplies a target Actor to CastSpell/Attack.
  repeated Actor candidate_targets = 4;
  MultiTargetGridContext grid_context = 5;
}

message AvailableAction {
  AvailableActionKind kind = 1;
  // Human-readable, engine-composed from real data — e.g. "Attack the
  // Goblin with your Longsword" — not left for Master or the DM model
  // to phrase from raw fields.
  string label = 2;
  // The weapon/spell name behind this option, e.g. "Longsword",
  // "Magic Missile" — empty for Grapple/Shove.
  string source_name = 3;
  // Empty for a targetless action (e.g. a self-only spell).
  string target_character_id = 4;
  ActionEconomyCategory action_economy_category = 5;
}

message GetAvailableActionsResponse {
  bool success = 1;
  string error = 2;
  // False when actor is incapacitated (Paralyzed/Stunned/Petrified/
  // Incapacitated) and cannot act at all this turn — see
  // cannot_act_reason. Deliberately independent of the HP-based
  // Unconscious/Dying/Dead status (CharacterStatus/GetCharacterStatus):
  // a downed character still gets a turn to roll a death saving throw,
  // which this field does not report on.
  bool can_act = 3;
  string cannot_act_reason = 4; // set when can_act = false, e.g. "Paralyzed"
  bool has_action = 5;
  bool has_bonus_action = 6;
  bool has_reaction = 7;
  repeated AvailableAction actions = 8;
}

message GrappleRequest {
  string request_id = 1;
  string campaign_id = 2;
  Actor actor = 3;
  Actor target = 4;
  // Optional: same shape and "omitted skips the range/LOS check" rule
  // as Attack/CastSpell's own grid_context.
  GridContext grid_context = 5;
}

message GrappleResponse {
  bool success = 1;
  // Set when success = false: no free hand, out of reach, no line of
  // sight, incapacitated, no action available — the attempt was never
  // rolled at all, not a failed roll.
  string error = 2;
  Actor actor = 3;
  Actor target = 4;
  string result_message = 5;
  // True when the opposed check succeeded and Grappled was applied —
  // distinct from success the same way AttackResponse.hit is distinct
  // from AttackResponse.success: a real, legally-rolled attempt that
  // simply loses the contest is still success = true, grappled = false.
  bool grappled = 6;
}

// ShoveEffect selects which of the two SRD Shove outcomes actor is
// attempting. SHOVE_EFFECT_UNSPECIFIED is the required proto3 zero
// value, not a real choice — the engine rejects a request carrying it.
enum ShoveEffect {
  SHOVE_EFFECT_UNSPECIFIED = 0;
  SHOVE_EFFECT_PRONE = 1;
  SHOVE_EFFECT_PUSH = 2;
}

message ShoveRequest {
  string request_id = 1;
  string campaign_id = 2;
  Actor actor = 3;
  Actor target = 4;
  ShoveEffect effect = 5;
  GridContext grid_context = 6;
}

message ShoveResponse {
  bool success = 1;
  string error = 2;
  Actor actor = 3;
  Actor target = 4;
  string result_message = 5;
  // True when the opposed check succeeded and the effect was applied —
  // same success/shoved distinction as Attack's hit field.
  bool shoved = 6;
}

// EquipmentSlot mirrors OpenCombatEngine's own EquipmentSlot enum.
// EQUIPMENT_SLOT_UNSPECIFIED is the required proto3 zero value, not a
// real slot — the engine rejects a request carrying it.
enum EquipmentSlot {
  EQUIPMENT_SLOT_UNSPECIFIED = 0;
  EQUIPMENT_SLOT_MAIN_HAND = 1;
  EQUIPMENT_SLOT_OFF_HAND = 2;
  EQUIPMENT_SLOT_ARMOR = 3;
  EQUIPMENT_SLOT_SHIELD = 4;
  EQUIPMENT_SLOT_HEAD = 5;
  EQUIPMENT_SLOT_NECK = 6;
  EQUIPMENT_SLOT_SHOULDERS = 7;
  EQUIPMENT_SLOT_HANDS = 8;
  EQUIPMENT_SLOT_WAIST = 9;
  EQUIPMENT_SLOT_FEET = 10;
  EQUIPMENT_SLOT_RING_1 = 11;
  EQUIPMENT_SLOT_RING_2 = 12;
}

message EquipItemRequest {
  string request_id = 1;
  string campaign_id = 2;
  Actor actor = 3;
  // Must already be a real member of actor's inventory — this call
  // does not accept an invented item.
  string item_name = 4;
  EquipmentSlot slot = 5;
}

message EquipItemResponse {
  bool success = 1;
  // Set when success = false: item_name isn't in actor's inventory,
  // slot is unspecified, or the item can't occupy that slot (e.g. a
  // weapon into the Armor slot) — a real mechanical rejection.
  string error = 2;
  Actor actor = 3;
  string result_message = 4;
}

message UnequipItemRequest {
  string request_id = 1;
  string campaign_id = 2;
  Actor actor = 3;
  EquipmentSlot slot = 4;
}

message UnequipItemResponse {
  bool success = 1;
  string error = 2;
  Actor actor = 3;
  string result_message = 4;
}

message AddItemToInventoryRequest {
  string request_id = 1;
  string campaign_id = 2;
  Actor actor = 3;
  // Resolved against the sidecar's real Open5e-backed item library —
  // an unrecognized name is a real rejection, not a guess. No
  // quantity field: one item per call (see RELEASE_NOTES/README for
  // why — this engine has no item-stacking concept).
  string item_name = 4;
}

message AddItemToInventoryResponse {
  bool success = 1;
  string error = 2; // set when item_name isn't a real SRD item
  Actor actor = 3;
  string result_message = 4;
}

message RemoveItemFromInventoryRequest {
  string request_id = 1;
  string campaign_id = 2;
  Actor actor = 3;
  string item_name = 4;
}

message RemoveItemFromInventoryResponse {
  bool success = 1;
  string error = 2; // set when item_name isn't in actor's inventory
  Actor actor = 3;
  string result_message = 4;
}

message TransferItemRequest {
  string request_id = 1;
  string campaign_id = 2;
  Actor source = 3;
  Actor target = 4;
  // Must already be a real member of source's inventory.
  string item_name = 5;
}

message TransferItemResponse {
  bool success = 1;
  string error = 2; // set when item_name isn't in source's inventory
  Actor source = 3;
  Actor target = 4;
  string result_message = 5;
}

message GenerateLootRequest {
  string request_id = 1;
  string campaign_id = 2;
  // The creatures this roll's treasure is appropriate for — an
  // encounter roster being prepped, or a single monster. Each must
  // carry a real challenge_rating (see the character schema) or the
  // whole call is rejected.
  repeated Actor participants = 3;
}

message GenerateLootResponse {
  bool success = 1;
  // Set when the participant list is empty, or any participant has no
  // real challenge_rating recorded.
  string error = 2;
  int32 copper = 3;
  int32 silver = 4;
  int32 gold = 5;
  int32 platinum = 6;
  // At most one item — this engine's loot generator awards zero or one
  // item per roll, never a list.
  string item_name = 7;
  string result_message = 8;
}

message AddCurrencyRequest {
  string request_id = 1;
  string campaign_id = 2;
  Actor actor = 3;
  int32 copper = 4;
  int32 silver = 5;
  int32 gold = 6;
  int32 platinum = 7;
}

message AddCurrencyResponse {
  bool success = 1;
  string error = 2;
  Actor actor = 3;
  string result_message = 4;
}

message TransferCurrencyRequest {
  string request_id = 1;
  string campaign_id = 2;
  Actor source = 3;
  Actor target = 4;
  int32 copper = 5;
  int32 silver = 6;
  int32 gold = 7;
  int32 platinum = 8;
}

message TransferCurrencyResponse {
  bool success = 1;
  // Set when source doesn't carry enough of a requested denomination.
  string error = 2;
  Actor source = 3;
  Actor target = 4;
  string result_message = 5;
}

message RemoveCurrencyRequest {
  string request_id = 1;
  string campaign_id = 2;
  Actor actor = 3;
  int32 copper = 4;
  int32 silver = 5;
  int32 gold = 6;
  int32 platinum = 7;
}

message RemoveCurrencyResponse {
  bool success = 1;
  // Set when actor doesn't carry enough of a requested denomination.
  string error = 2;
  Actor actor = 3;
  string result_message = 4;
}

message GetItemInfoRequest {
  string request_id = 1;
  string item_name = 2;
}

message GetItemInfoResponse {
  bool success = 1;
  string error = 2; // set when item_name isn't a real recognized item
  string item_name = 3;
  // Minimal-coin decomposition of the item's real base price (IItem.Value,
  // copper pieces) — never Master-invented. A future per-campaign price
  // adjustment (docs/design.md §9) is applied by Master on top of this
  // engine-authoritative base, not baked in here.
  int32 copper = 4;
  int32 silver = 5;
  int32 gold = 6;
  int32 platinum = 7;
  string result_message = 8;
}

message ListInventoryRequest {
  string request_id = 1;
  Actor actor = 2;
}

message ListInventoryResponse {
  bool success = 1;
  string error = 2;
  // Real item names currently in actor's inventory — each independently
  // resolvable via GetItemInfo for pricing.
  repeated string item_names = 3;
}

// CharacterCreationMode selects how much of the question sequence
// StartCharacterCreation actually surfaces to the player.
// CHARACTER_CREATION_MODE_UNSPECIFIED is the required proto3 zero
// value, not a real mode — the engine rejects a request carrying it,
// the same "never let an unset value silently mean something valid"
// reasoning as every other enum in this contract.
enum CharacterCreationMode {
  CHARACTER_CREATION_MODE_UNSPECIFIED = 0;
  // Player picks race, class, and gender; everything else (background,
  // ability scores, starting spells) is rolled by the engine itself —
  // fewer questions, not zero.
  CHARACTER_CREATION_MODE_QUICK = 1;
  // Every step is a real, player-visible prompt.
  CHARACTER_CREATION_MODE_DETAILED = 2;
}

message StartCharacterCreationRequest {
  // Master-generated, the same id scheme as any other Master-assigned
  // id (character_id, vehicle_id) — the engine only keys its own
  // session table on this, it never generates or interprets it.
  string session_id = 1;
  string campaign_id = 2;
  CharacterCreationMode mode = 3;
  // The player's own already-typed display name — the finished
  // character's Name is set from this directly; it is never asked as
  // a prompt of its own.
  string character_name = 4;
}

message AnswerCharacterCreationPromptRequest {
  string session_id = 1;
  // The chosen option's raw value (must be a real member of the most
  // recent CharacterCreationPromptResponse.choices for this session),
  // or free text for a prompt with no enumerated choices (today, only
  // the gender prompt).
  string answer = 2;
}

message CharacterCreationPromptResponse {
  bool success = 1;
  // Set when success = false: unknown/expired session_id, or answer
  // isn't a real member of the pending prompt's choices.
  string error = 2;
  // True once every question this session's mode requires has been
  // answered — actor is set, prompt_text/choices are not.
  bool done = 3;
  string prompt_text = 4;
  // Enumerated options the player picks from; empty means the client
  // should collect free text instead (today, only the gender prompt).
  repeated string choices = 5;
  // Set only when done = true: the finished, fully-generated character.
  Actor actor = 6;
}

message ListClassSpellsRequest {
  string class_name = 1;
}

message ListClassSpellsResponse {
  bool success = 1;
  string error = 2; // set when class_name isn't a real spellcasting class
  repeated string cantrips = 3;
  // Level-1 spells only, at this scope.
  repeated string leveled_spells = 4;
}
